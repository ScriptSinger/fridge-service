; OPcache — was previously unset because this path was an empty directory,
; so the bind-mount in docker-compose.yml silently mounted nothing.
; See https://www.php.net/manual/en/opcache.installation.php
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Safe because containers are recreated on every deploy (docker compose up --build),
; which restarts php-fpm and drops the compiled cache.
opcache.validate_timestamps=0
